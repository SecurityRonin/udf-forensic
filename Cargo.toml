[workspace]
resolver = "2"
members = ["core", "forensic"]

# Single source of truth for fields shared by both members (DRY): the reader
# (`udf-core`) and the analyzer (`udf-forensic`) publish independently but share
# edition, license, MSRV floor, repository metadata and the lint posture.
[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/udf-forensic"
homepage = "https://github.com/SecurityRonin/udf-forensic"
readme = "README.md"

[workspace.dependencies]
udf-core = { version = "0.1.0", path = "core" }
forensicnomicon = "1"
# The fleet's single audited bounds-checked integer reader (no_std, forbid(unsafe),
# fuzzed): fixed-width reads return 0 out of range instead of panicking.
safe-read = "0.1"
serde = { version = "1", features = ["derive"] }
# forensic-vfs (KNOWLEDGE leaf) — the read-only FileSystem navigation contract.
forensic-vfs = { version = "0.9" }

# The full fleet base tier, shared by both members. Both parse untrusted,
# attacker-controllable UDF images, so an unwrap/expect in production is a
# denial-of-service panic vector.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all                      = { level = "warn", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
correctness              = { level = "deny", priority = -1 }
suspicious               = { level = "deny", priority = -1 }
unwrap_used              = { level = "deny", priority = 0 }
expect_used              = { level = "deny", priority = 0 }
module_name_repetitions  = { level = "allow", priority = 1 }
must_use_candidate       = { level = "allow", priority = 1 }
missing_errors_doc       = { level = "allow", priority = 1 }
missing_panics_doc       = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap       = { level = "allow", priority = 1 }
cast_sign_loss           = { level = "allow", priority = 1 }
cast_precision_loss      = { level = "allow", priority = 1 }
too_many_lines           = { level = "allow", priority = 1 }
items_after_statements   = { level = "allow", priority = 1 }
similar_names            = { level = "allow", priority = 1 }
manual_let_else          = { level = "allow", priority = 1 }
