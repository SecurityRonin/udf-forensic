name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@85c7263e5e1a25a090f602419ac27f87aeb1d1e3
    with:
      # Carries across the existing gate verbatim. The hand-written coverage job
      # ran `cargo llvm-cov --workspace --all-features --fail-under-lines 96
      # --show-missing-lines`, and gated lines rather than functions on purpose
      # (its own comment records that llvm-cov emits an always-zero `<_>`
      # template region, which makes a function gate unusable here). The 96 is
      # deliberate; inheriting the default strict per-line gate would raise the
      # bar, so the floor moves across unchanged.
      coverage-gate: floor
      coverage-floor: 96
      # The hand-written test job ran on ubuntu-latest only — it never had a
      # `matrix.os`. Leaving the default (true) would newly add macOS and
      # Windows runners, which is an expansion this adoption has no mandate to
      # make. Carries the existing single-platform decision across.
      os-matrix: false
