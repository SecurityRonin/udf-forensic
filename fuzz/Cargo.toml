[package]
name = "udf-forensic-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Standalone workspace: the fuzz crate must not be pulled into the parent
# crate's build graph (cargo-fuzz builds it against a nightly toolchain with
# sanitizers).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# The fuzzed entry points (detection, the AVDP→VDS→FSD bootstrap, File Entry
# data + allocation descriptors, directory FID traversal + OSTA name decode)
# all live in the udf-forensic reader. `vfs` off — the fuzzed surface is the
# raw byte parsers, not the forensic-vfs adapter.
[dependencies.udf-forensic]
path = ".."

[[bin]]
name = "detect"
path = "fuzz_targets/detect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_state"
path = "fuzz_targets/parse_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_fe"
path = "fuzz_targets/read_fe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_dir"
path = "fuzz_targets/read_dir.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
